changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "Breaking changes"
      labels:
        - breaking-change
    - title: "Features"
      labels:
        - enhancement
    - title: "Fixes"
      labels:
        - bug
    - title: "Documentation"
      labels:
        - documentation
    - title: "Maintenance"
      labels:
        - dependencies
        - automation
        - maintenance
    - title: "Other changes"
      labels:
        - "*"
